<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowCenter" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#431407" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0b0f19" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="robotHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="orangeArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Tech Canvas -->
  <rect width="1200" height="675" fill="url(#bgGlowCenter)"/>

  <!-- Network Grid & Constellation Points -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="0.8">
    <line x1="80" y1="120" x2="220" y2="80"/>
    <line x1="220" y1="80" x2="360" y2="140"/>
    <line x1="360" y1="140" x2="480" y2="90"/>
    <line x1="480" y1="90" x2="620" y2="130"/>
    <line x1="620" y1="130" x2="780" y2="70"/>
    <line x1="780" y1="70" x2="940" y2="110"/>
    <line x1="940" y1="110" x2="1120" y2="80"/>
    <line x1="120" y1="260" x2="280" y2="300"/>
    <line x1="900" y1="280" x2="1080" y2="240"/>
  </g>
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="80" cy="120" r="3"/>
    <circle cx="220" cy="80" r="3.5"/>
    <circle cx="360" cy="140" r="4"/>
    <circle cx="480" cy="90" r="3"/>
    <circle cx="620" cy="130" r="4"/>
    <circle cx="780" cy="70" r="3.5"/>
    <circle cx="940" cy="110" r="4.5"/>
    <circle cx="1120" cy="80" r="3"/>
  </g>

  <!-- Warm Bokeh Particles -->
  <circle cx="150" cy="450" r="40" fill="#f97316" opacity="0.15" filter="url(#glow)"/>
  <circle cx="560" cy="380" r="80" fill="#ea580c" opacity="0.2" filter="url(#glow)"/>
  <circle cx="750" cy="220" r="100" fill="#f59e0b" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1020" cy="480" r="60" fill="#f97316" opacity="0.18" filter="url(#glow)"/>

  <!-- Left Side: Computer Monitor with Growth Charts -->
  <g transform="translate(60, 200)">
    <!-- Monitor Base & Stand -->
    <rect x="80" y="165" width="40" height="35" rx="4" fill="#334155"/>
    <ellipse cx="100" cy="195" rx="55" ry="12" fill="#1e293b"/>
    <!-- Screen Body -->
    <rect x="0" y="0" width="200" height="170" rx="14" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <rect x="8" y="8" width="184" height="135" rx="8" fill="#020617"/>
    <!-- Chart Grid Lines -->
    <line x1="20" y1="120" x2="180" y2="120" stroke="#334155" stroke-width="1"/>
    <line x1="20" y1="90" x2="180" y2="90" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="20" y1="60" x2="180" y2="60" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Rising Graph Line -->
    <path d="M 25 110 L 60 95 L 95 105 L 135 60 L 175 35" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <!-- Bar chart pillars -->
    <rect x="30" y="100" width="12" height="20" rx="2" fill="#38bdf8" opacity="0.7"/>
    <rect x="55" y="85" width="12" height="35" rx="2" fill="#38bdf8" opacity="0.7"/>
    <rect x="80" y="75" width="12" height="45" rx="2" fill="#38bdf8" opacity="0.7"/>
    <rect x="105" y="60" width="12" height="60" rx="2" fill="#38bdf8" opacity="0.7"/>
    <rect x="130" y="45" width="12" height="75" rx="2" fill="#38bdf8" opacity="0.7"/>
    <rect x="155" y="30" width="12" height="90" rx="2" fill="#f59e0b"/>
    <!-- Mini Idea Bulb on Screen -->
    <circle cx="35" cy="40" r="14" fill="#ea580c" opacity="0.8"/>
    <circle cx="35" cy="40" r="8" fill="#fef08a" filter="url(#softGlow)"/>
  </g>

  <!-- Left Bottom: Megaphone (Loudspeaker) -->
  <g transform="translate(180, 320) rotate(-15)">
    <path d="M 0 35 L 75 10 L 75 70 L 0 45 Z" fill="#ea580c" stroke="#f97316" stroke-width="2"/>
    <ellipse cx="75" cy="40" rx="14" ry="30" fill="#fb923c"/>
    <rect x="-25" y="30" width="28" height="20" rx="4" fill="#f1f5f9"/>
    <!-- Sound Waves -->
    <path d="M 95 20 Q 115 40 95 60" fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    <path d="M 108 12 Q 135 40 108 68" fill="none" stroke="#fde047" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 122 5 Q 155 40 122 75" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bottom Left: Colorful Pie Chart -->
  <g transform="translate(210, 480)">
    <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M 50 50 L 50 2 A 48 48 0 0 1 98 50 Z" fill="#38bdf8"/>
    <path d="M 50 50 L 98 50 A 48 48 0 0 1 70 94 Z" fill="#34d399"/>
    <path d="M 50 50 L 70 94 A 48 48 0 0 1 12 75 Z" fill="#f59e0b"/>
    <path d="M 50 50 L 12 75 A 48 48 0 0 1 12 25 Z" fill="#ef4444"/>
    <path d="M 50 50 L 12 25 A 48 48 0 0 1 50 2 Z" fill="#fbbf24"/>
    <circle cx="50" cy="50" r="16" fill="#0b0f19"/>
  </g>

  <!-- Bottom Search Bar & Magnifying Glass -->
  <g transform="translate(320, 435)">
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <rect x="180" y="4" width="30" height="30" rx="15" fill="#f59e0b"/>
    <circle cx="193" cy="17" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="198" y1="21" x2="204" y2="27" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="19" x2="140" y2="19" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Checklist Box -->
  <g transform="translate(560, 415)">
    <rect x="0" y="0" width="105" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 15 25 L 22 32 L 34 18" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="25" x2="90" y2="25" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15 55 L 22 62 L 34 48" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="55" x2="90" y2="55" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15 85 L 22 92 L 34 78" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="85" x2="90" y2="85" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Golden Stacks of Coins -->
  <g transform="translate(680, 430)">
    <!-- Stack 1 -->
    <ellipse cx="30" cy="90" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="30" cy="80" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="30" cy="70" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="30" cy="60" rx="25" ry="8" fill="url(#coinGrad)"/>
    <!-- Stack 2 -->
    <ellipse cx="75" cy="90" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="75" cy="80" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="75" cy="70" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="75" cy="60" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="75" cy="50" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="75" cy="40" rx="25" ry="8" fill="url(#coinGrad)"/>
  </g>

  <!-- Big Energetic 3D Growth Arrow -->
  <g>
    <path d="M 520 540 C 650 540 760 480 940 370" fill="none" stroke="url(#orangeArrowGrad)" stroke-width="26" stroke-linecap="round" filter="url(#softGlow)"/>
    <polygon points="975,345 925,355 945,395" fill="#facc15" filter="url(#softGlow)"/>
  </g>

  <!-- Right Side: Smartphone (WhatsApp / Social Funnel) -->
  <g transform="translate(1010, 250)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="135" height="230" rx="22" fill="#0f172a" stroke="#475569" stroke-width="3.5"/>
    <rect x="6" y="8" width="123" height="214" rx="16" fill="#020617"/>
    <!-- Speaker & Camera -->
    <ellipse cx="67" cy="18" rx="14" ry="3" fill="#334155"/>
    <!-- User Avatar & Header -->
    <circle cx="30" cy="45" r="14" fill="#0284c7"/>
    <circle cx="30" cy="40" r="5" fill="#ffffff"/>
    <path d="M 22 53 C 22 47 38 47 38 53 Z" fill="#ffffff"/>
    <rect x="52" y="38" width="60" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="52" y="48" width="40" height="5" rx="2.5" fill="#64748b"/>
    <!-- Chat Bubbles -->
    <rect x="14" y="70" width="80" height="24" rx="8" fill="#ea580c"/>
    <rect x="22" y="78" width="50" height="4" rx="2" fill="#ffffff"/>
    <rect x="22" y="84" width="30" height="3" rx="1.5" fill="#ffffff"/>

    <rect x="40" y="105" width="82" height="28" rx="8" fill="#059669"/>
    <rect x="50" y="114" width="55" height="4" rx="2" fill="#ffffff"/>
    <rect x="50" y="121" width="38" height="3" rx="1.5" fill="#ffffff"/>

    <rect x="14" y="145" width="70" height="20" rx="8" fill="#334155"/>
    <rect x="22" y="153" width="45" height="4" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Floating Social Media Floating Badges -->
  <!-- Thumb Up -->
  <g transform="translate(100, 410) scale(1.1)">
    <circle cx="20" cy="20" r="18" fill="#0284c7" filter="url(#softGlow)"/>
    <path d="M 14 18 L 14 26 L 18 26 L 18 18 Z M 19 18 L 22 10 C 23 9 25 10 25 12 L 24 16 L 28 16 C 30 16 30 18 29 20 L 26 26 L 19 26 Z" fill="#ffffff"/>
  </g>
  <!-- Heart Icon -->
  <g transform="translate(230, 110) scale(1.1)">
    <rect x="0" y="0" width="38" height="34" rx="10" fill="#f97316" filter="url(#softGlow)"/>
    <path d="M 19 26 C 14 21 8 16 8 11 C 8 8 11 5 14 5 C 16 5 18 7 19 9 C 20 7 22 5 24 5 C 27 5 30 8 30 11 C 30 16 24 21 19 26 Z" fill="#ffffff"/>
  </g>
  <!-- Heart Icon 2 -->
  <g transform="translate(950, 140) scale(0.9)">
    <rect x="0" y="0" width="34" height="30" rx="8" fill="#f97316"/>
    <path d="M 17 23 C 13 18 8 14 8 10 C 8 7 10 5 13 5 C 15 5 16 6 17 8 C 18 6 19 5 21 5 C 24 5 26 7 26 10 C 26 14 21 18 17 23 Z" fill="#ffffff"/>
  </g>
  <!-- Hashtag Icon -->
  <g transform="translate(1030, 460) scale(1.1)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#ea580c"/>
    <text x="18" y="26" fill="#ffffff" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">#</text>
  </g>

  <!-- CENTER-RIGHT: 3D CLAUDE AI ROBOT MASCOT -->
  <g transform="translate(710, 80)">
    <!-- Halo glow behind robot -->
    <circle cx="100" cy="110" r="110" fill="url(#robotHalo)"/>
    <ellipse cx="100" cy="110" rx="90" ry="90" fill="none" stroke="#f59e0b" stroke-width="4" filter="url(#softGlow)"/>

    <!-- Robot Ears / Antennas -->
    <rect x="0" y="80" width="16" height="36" rx="8" fill="#94a3b8"/>
    <rect x="184" y="80" width="16" height="36" rx="8" fill="#94a3b8"/>

    <!-- Robot Head (White glossy oval) -->
    <rect x="12" y="25" width="176" height="150" rx="75" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Head shine highlight -->
    <path d="M 40 40 Q 100 30 145 45" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- Dark Face Visor -->
    <rect x="32" y="55" width="136" height="85" rx="42" fill="#0f172a"/>

    <!-- Glowing Amber Eyes -->
    <ellipse cx="68" cy="92" rx="16" ry="12" fill="#f59e0b" filter="url(#softGlow)"/>
    <circle cx="68" cy="92" r="6" fill="#fef08a"/>
    <ellipse cx="132" cy="92" rx="16" ry="12" fill="#f59e0b" filter="url(#softGlow)"/>
    <circle cx="132" cy="92" r="6" fill="#fef08a"/>

    <!-- Smiling Mouth -->
    <path d="M 85 116 Q 100 128 115 116" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Robot Torso / Body -->
    <path d="M 40 185 L 160 185 L 180 340 L 20 340 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="65" y="210" width="70" height="50" rx="10" fill="#0f172a"/>
    <circle cx="100" cy="235" r="12" fill="#f59e0b" filter="url(#softGlow)"/>

    <!-- Left Hand Holding Lightbulb -->
    <!-- Arm reaching right -->
    <path d="M 165 210 Q 210 240 230 215" fill="none" stroke="#e2e8f0" stroke-width="22" stroke-linecap="round"/>
    <circle cx="230" cy="215" r="14" fill="#94a3b8"/>
    <!-- Open Fingers Cupping Bulb -->
    <path d="M 225 215 L 245 195 M 230 220 L 255 210 M 230 225 L 250 230" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>

    <!-- Glowing Incandescent Idea Lightbulb -->
    <g transform="translate(245, 125)">
      <circle cx="25" cy="30" r="45" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>
      <path d="M 10 30 C 10 18 18 10 28 10 C 38 10 46 18 46 30 C 46 38 40 44 38 50 L 18 50 C 16 44 10 38 10 30 Z" fill="#fef08a" stroke="#f59e0b" stroke-width="3" filter="url(#softGlow)"/>
      <!-- Filament -->
      <path d="M 22 40 L 24 24 L 28 32 L 32 24 L 34 40" fill="none" stroke="#ea580c" stroke-width="2.5"/>
      <!-- Bulb Base screw -->
      <rect x="18" y="52" width="20" height="6" rx="2" fill="#94a3b8"/>
      <rect x="20" y="58" width="16" height="5" rx="2" fill="#64748b"/>
      <!-- Radiating Idea Rays -->
      <line x1="28" y1="-5" x2="28" y2="4" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <line x1="55" y1="8" x2="48" y2="15" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <line x1="65" y1="30" x2="54" y2="30" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="8" y2="15" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <line x1="-8" y1="30" x2="2" y2="30" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- CENTER-LEFT: BOLD HEADLINE "Claude AI Marketing" -->
  <g transform="translate(285, 230)">
    <!-- Drop Shadow -->
    <text x="5" y="85" fill="#000000" font-size="94" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" opacity="0.6">
      Claude AI
    </text>
    <!-- Crisp White "Claude AI" -->
    <text x="0" y="80" fill="#ffffff" font-size="94" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="-1">
      Claude AI
    </text>

    <!-- Drop Shadow "Marketing" -->
    <text x="5" y="195" fill="#451a03" font-size="108" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" opacity="0.8">
      Marketing
    </text>
    <!-- Glowing Golden-Yellow "Marketing" -->
    <text x="0" y="190" fill="url(#goldTextGrad)" font-size="108" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="-1" filter="url(#softGlow)">
      Marketing
    </text>
  </g>

  <!-- Top Right AI Badge -->
  <g transform="translate(1015, 25)">
    <rect x="0" y="0" width="155" height="42" rx="14" fill="#ffffff" opacity="0.95" filter="url(#softGlow)"/>
    <text x="77" y="27" fill="#0f172a" font-size="16" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">
      Made with AI
    </text>
  </g>
</svg>
